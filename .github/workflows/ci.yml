name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-ts:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  lint-py:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

  typecheck-py:
    name: Typecheck Python
    runs-on: ubuntu-latest
    needs: lint-py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Mypy (strict — workspace-wide, advisory)
        # Workspace-wide mypy is currently advisory because workspace
        # packages (selva_*, madfam_*) cannot be resolved by mypy across
        # the monorepo without additional package-installation wiring.
        # The actionable enforcement is the nexus-api ratchet step below.
        # Drop `continue-on-error` once the workspace import-not-found
        # noise is resolved.
        continue-on-error: true
        run: uv run mypy apps/nexus-api/ apps/workers/ packages/

      - name: Mypy ratchet — nexus-api (no new errors allowed)
        # Phase 2 mypy baseline elimination: any PR may *only* lower the
        # error count, never raise it.  The threshold is hand-set to the
        # post-fix count of the most recent ratchet PR.  When you bring
        # the count down, also lower MAX_MYPY_ERRORS in the same PR so
        # the next regressor cannot quietly creep back up to today's
        # ceiling.
        #
        # IMPORTANT: mypy is invoked from the **repo root** so the
        # `mypy_path` entries in pyproject.toml resolve correctly to
        # workspace packages.  Running `cd apps/nexus-api && uv run mypy .`
        # breaks workspace-package resolution because the relative
        # `mypy_path` entries become invalid.  See wave 3 history below.
        #
        # History:
        #   2026-05-03 — wave 1 (PR #97): 100 → 47 (cached-cache count;
        #     fresh-cache baseline was 20 — the 47 ceiling was set under
        #     a stale .mypy_cache that hid 27 errors).
        #   2026-05-04 — wave 1.5: 20 → 11 (fresh cache).
        #     All 11 remaining were workspace-package import-not-found
        #     errors (selva_skills, madfam_inference) blocked on a mypy
        #     monorepo-resolution fix that was out of scope.
        #   2026-05-03 — wave 3 (this PR): 11 → 0.  Switched the ratchet
        #     invocation from `cd apps/nexus-api && uv run mypy .` to
        #     `uv run mypy apps/nexus-api/` so that the root pyproject's
        #     `mypy_path` resolves workspace packages (selva_skills,
        #     madfam_inference, etc.).  Added `celery.*` to the
        #     ignore_missing_imports overrides.  Fixed 4 latent bugs
        #     surfaced by the now-resolving imports:
        #       - apps/nexus-api/.../invoices.py — wrong import path
        #         (`adapters.compliance` → `adapters.karafiel`) AND a
        #         missing `await` on `KarafielAdapter.get_cfdi_status`
        #         that was being thread-pooled instead of awaited.
        #       - apps/nexus-api/.../main.py — `tags=s.tags` referenced
        #         a non-existent attribute on `SkillMetadata`.
        #       - apps/nexus-api/.../acp_server.py — two stale
        #         `# type: ignore` comments (now resolvable, so unused).
        #       - packages/skills/.../skill_md.py — same.
        run: |
          set -euo pipefail
          MAX_MYPY_ERRORS=0
          OUTPUT="$(uv run mypy apps/nexus-api/ 2>&1 || true)"
          # Mypy from the repo root traverses into workspace packages
          # (selva_*, madfam_*) — that's intentional, it gives nexus-api
          # accurate types instead of `Any`.  But we only ratchet the
          # nexus-api error count here; workspace-package errors are
          # tracked separately by the advisory `Mypy (strict — workspace-wide)`
          # step above.  Filter the output to nexus-api file paths only.
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -E '^apps/nexus-api/' | grep -c 'error:' || echo 0)"
          echo "mypy errors in apps/nexus-api: ${COUNT} (ceiling: ${MAX_MYPY_ERRORS})"
          if [ "${COUNT:-0}" -gt "${MAX_MYPY_ERRORS}" ]; then
            echo "::error::mypy error count grew (was ≤${MAX_MYPY_ERRORS}, now ${COUNT}). Either fix the new errors or, if you intentionally accept a regression, bump MAX_MYPY_ERRORS in .github/workflows/ci.yml with justification in the PR body."
            echo "----- nexus-api mypy errors -----"
            printf '%s\n' "$OUTPUT" | grep -E '^apps/nexus-api/' || true
            exit 1
          fi
          if [ "${COUNT:-0}" -lt "${MAX_MYPY_ERRORS}" ]; then
            echo "::notice::mypy error count dropped from ${MAX_MYPY_ERRORS} to ${COUNT}. Lower MAX_MYPY_ERRORS in this PR so the ratchet stays tight."
          fi

      - name: Mypy ratchet — workers (no new errors allowed)
        # History:
        #   2026-05-04 — wave 3 cleanup: 14 → 0. Added _state_str /
        #     _state_dict helpers in __main__.py for type-safe access on
        #     loosely-typed graph state dicts; normalized KarafielAdapter
        #     return types to dict via .model_dump(); fixed research.py
        #     join() to filter to str-only multimodal content; removed
        #     stale # type: ignore comments from attribution.py +
        #     event_emitter.py.
        run: |
          set -euo pipefail
          MAX_MYPY_ERRORS=0
          OUTPUT="$(uv run mypy apps/workers/ 2>&1 || true)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -E '^apps/workers/' | grep -c 'error:' || echo 0)"
          echo "mypy errors in apps/workers: ${COUNT} (ceiling: ${MAX_MYPY_ERRORS})"
          if [ "${COUNT:-0}" -gt "${MAX_MYPY_ERRORS}" ]; then
            echo "::error::mypy error count grew (was ≤${MAX_MYPY_ERRORS}, now ${COUNT}). Either fix the new errors or, if you intentionally accept a regression, bump MAX_MYPY_ERRORS in .github/workflows/ci.yml with justification in the PR body."
            echo "----- workers mypy errors -----"
            printf '%s\n' "$OUTPUT" | grep -E '^apps/workers/' || true
            exit 1
          fi
          if [ "${COUNT:-0}" -lt "${MAX_MYPY_ERRORS}" ]; then
            echo "::notice::workers mypy errors dropped from ${MAX_MYPY_ERRORS} to ${COUNT}. Lower MAX_MYPY_ERRORS in this PR so the ratchet stays tight."
          fi

      - name: Mypy ratchet — packages (no new errors allowed)
        # History:
        #   2026-05-04 — wave 5 baseline: 129 → 116. Fixed two latent
        #     silent-failure bugs surfaced by mypy:
        #       - madfam_inference.base.InferenceProvider.stream was
        #         declared ``async def -> AsyncIterator`` but every
        #         override is an async-generator (async def + yield).
        #         The mismatch typed call sites as
        #         ``Coroutine[..., AsyncIterator]`` so ``async for`` in
        #         ModelRouter.stream broke at type check (and the call
        #         site happened to never execute because no caller
        #         streamed). Switched abstract to plain ``def``.
        #       - workflows/nodes/agent.py was calling call_llm with
        #         the wrong arg shape (passing a single InferenceRequest
        #         where call_llm expects router + messages), without
        #         ``await``, and accessing ``response.content`` on what
        #         is actually a plain ``str``. Broken since written; the
        #         broad ``except`` silently fell through to the static
        #         fallback on every workflow run. Fixed call to the
        #         correct API + asyncio.run() bridge.
        run: |
          set -euo pipefail
          MAX_MYPY_ERRORS=116
          OUTPUT="$(uv run mypy packages/ 2>&1 || true)"
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -E '^packages/' | grep -c 'error:' || echo 0)"
          echo "mypy errors in packages/: ${COUNT} (ceiling: ${MAX_MYPY_ERRORS})"
          if [ "${COUNT:-0}" -gt "${MAX_MYPY_ERRORS}" ]; then
            echo "::error::mypy error count grew (was ≤${MAX_MYPY_ERRORS}, now ${COUNT}). Either fix the new errors or, if you intentionally accept a regression, bump MAX_MYPY_ERRORS in .github/workflows/ci.yml with justification in the PR body."
            echo "----- packages mypy errors -----"
            printf '%s\n' "$OUTPUT" | grep -E '^packages/' || true
            exit 1
          fi
          if [ "${COUNT:-0}" -lt "${MAX_MYPY_ERRORS}" ]; then
            echo "::notice::packages mypy errors dropped from ${MAX_MYPY_ERRORS} to ${COUNT}. Lower MAX_MYPY_ERRORS in this PR so the ratchet stays tight."
          fi

  lint-community-skills:
    name: Lint Community Skills (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for community skill changes
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'packages/skills/community-skills/' || true)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.changed.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.changed.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        if: steps.changed.outputs.skip != 'true'
        run: uv sync

      - name: Ruff check community skills (errors + pyflakes only)
        if: steps.changed.outputs.skip != 'true'
        run: uv run ruff check --select E,F packages/skills/community-skills/

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: lint-ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test-ts:
    name: Test TypeScript
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  test-py:
    name: Test Python
    runs-on: ubuntu-latest
    needs: lint-py
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autoswarm
          POSTGRES_PASSWORD: autoswarm
          POSTGRES_DB: autoswarm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoswarm -d autoswarm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: postgresql://autoswarm:autoswarm@localhost:5432/autoswarm
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  critical-path-coverage:
    name: Critical Path Coverage Gate
    runs-on: ubuntu-latest
    needs: lint-py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      # Phase 2 critical-path coverage ratchet (Selva Office, May 2026).
      # The five files below are the highest-blast-radius surfaces in
      # the repo: JWT verification, the dispatch endpoint, voice-mode
      # consent ledger, outbound email governance, and worker auth
      # headers. A regression here is a security or tenancy incident.
      #
      # The threshold (75%) is the floor agreed in the Phase 2 PR.
      # When you raise the actual coverage on these files, also raise
      # ``--cov-fail-under`` in the same PR so the next regressor
      # cannot quietly creep back down to today's ceiling.
      - name: nexus-api critical paths
        run: |
          cd apps/nexus-api
          uv run pytest \
            tests/test_auth_coverage.py \
            tests/test_auth_worker_token_scoping.py \
            tests/test_database_coverage.py \
            tests/test_voice_mode_onboarding.py \
            tests/test_consent_ledger.py \
            tests/test_onboarding_coverage.py \
            tests/test_onboarding_outbound_identity.py \
            tests/test_swarms_coverage.py \
            tests/test_swarm_task_lifecycle.py \
            tests/test_dispatch_audience_gate.py \
            tests/test_dispatch_rate_limit.py \
            tests/test_performance_dispatch.py \
            --cov=nexus_api.auth \
            --cov=nexus_api.database \
            --cov=nexus_api.routers.onboarding \
            --cov=nexus_api.routers.swarms \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -q

      - name: outbound governance (email + marketing) critical paths
        run: |
          cd packages/tools
          uv run pytest \
            tests/test_email_voice_mode_gate.py \
            tests/test_email_signatures.py \
            tests/test_email_tools_coverage.py \
            tests/test_marketing_tools_coverage.py \
            --cov=selva_tools.builtins.email_tools \
            --cov=selva_tools.builtins.marketing_tools \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -q

      - name: artifact storage containment
        run: |
          cd packages/tools
          uv run pytest \
            --cov=selva_tools.storage.local \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            --ignore=tests/test_pricing_intel_weekly.py \
            -q

      - name: worker auth headers
        run: |
          cd apps/workers
          uv run pytest \
            tests/test_worker_auth.py \
            --cov=selva_workers.auth \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -q

      - name: workers (task lifecycle + interrupt + graphs)
        run: |
          cd apps/workers
          uv run pytest \
            tests/test_task_status.py \
            tests/test_event_emitter.py \
            tests/test_interrupt_handler.py \
            tests/test_learning.py \
            --cov=selva_workers.task_status \
            --cov=selva_workers.event_emitter \
            --cov=selva_workers.interrupt_handler \
            --cov=selva_workers.learning \
            --cov=selva_workers.graphs.coding \
            --cov=selva_workers.graphs.crm \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -q

      - name: workers (__main__ task driver)
        run: |
          cd apps/workers
          uv run pytest \
            tests/test_main_lifecycle.py \
            tests/test_worker_concurrency.py \
            tests/test_repo_validation.py \
            --cov=selva_workers.__main__ \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -q

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-ts, test-py, typecheck-py]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
