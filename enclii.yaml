---
apiVersion: enclii.dev/v1
kind: Service
metadata:
  name: selva-admin
  project: selva-office
  description: Selva Office — Admin dashboard
spec:
  build:
    type: dockerfile
    dockerfile: infra/docker/Dockerfile.admin
    context: .
    args:
      NEXT_PUBLIC_API_URL: https://api.selva.town
      NEXT_PUBLIC_JANUA_ISSUER_URL: https://auth.madfam.io
    source:
      git:
        repository: https://github.com/madfam-org/selva-office
        branch: main
        autoDeploy: true
  runtime:
    port: 3000
    replicas: 1
