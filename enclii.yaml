apiVersion: enclii.dev/v1
kind: Service
metadata:
  name: selva-workers
  project: selva-office
  description: Selva Office — Background task workers
spec:
  build:
    type: dockerfile
    dockerfile: infra/docker/Dockerfile.workers
    context: .
    source:
      git:
        repository: https://github.com/madfam-org/selva-office
        branch: main
        autoDeploy: true
  runtime:
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: selva-secrets
          key: database-url
    - name: REDIS_URL
      valueFrom:
        secretKeyRef:
          name: selva-secrets
          key: redis-url
---
# RFC 0034 P2 — the OpenAI-compatible /v1 inference proxy extracted from
# nexus-api into its own deployable. Same code (inference_proxy router), same
# auth, same USD usage ledger — but its uptime is now independent of
# campaign/agent/audit deploys of the monolith, which sits on 12 products' hot
# path. DUAL-RUN: nexus-api keeps serving /v1 on api.selva.town until every
# caller has migrated its SELVA_API_URL to inference.selva.town; only then is
# the nexus-api /v1 mount removed. See the cutover runbook (internal-devops).
apiVersion: enclii.dev/v1
kind: Service
metadata:
  name: selva-inference-gateway
  project: selva-office
  description: Selva Office — OpenAI-compatible LLM inference gateway (/v1)
spec:
  status:
    enabled: true
    entries:
      - name: Selva Inference Gateway
        url: https://inference.selva.town/health
        href: https://inference.selva.town
        group: Selva Office
        family: Selva Swarm
        description: OpenAI-compatible LLM inference proxy (the ecosystem chokepoint)
  build:
    type: dockerfile
    dockerfile: infra/docker/Dockerfile.inference-gateway
    context: .
    source:
      git:
        repository: https://github.com/madfam-org/selva-office
        branch: main
        autoDeploy: true
  runtime:
    port: 4306
    # Hot path for 12 products — start at 2 replicas for availability during
    # the extraction; scale on the SLO once migrated.
    replicas: 2
    resources:
      requests:
        cpu: "50m"
        memory: "384Mi"
      limits:
        cpu: "500m"
        memory: "768Mi"
    healthCheck: /health
    readinessProbe:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5
    livenessProbe:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10
  env:
    - name: PORT
      value: "4306"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: selva-secrets
          key: database-url
    - name: JANUA_ISSUER_URL
      value: https://auth.madfam.io
    - name: JANUA_CLIENT_ID
      value: selva-office
    - name: JANUA_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: selva-secrets
          key: janua-client-secret
    - name: WORKER_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: selva-secrets
          key: WORKER_API_TOKEN
    # Local inference backend for restricted/confidential data. Serves the
    # ecosystem's regulated payloads (clinical, fiscal, payroll) without
    # contacting any third-party vendor. Deployed by
    # infra/k8s/production/ollama.yaml; unset ⇒ every restricted call
    # fails closed with a 503 that names this variable.
    - name: OLLAMA_BASE_URL
      value: http://ollama.selva.svc.cluster.local:11434
    # Per-tenant sensitivity floors, token caps, timeouts and rate limits
    # (infra/k8s/production/tenant-policies.yaml).
    - name: TENANT_POLICY_PATH
      value: /etc/selva/tenant-policies/tenant-policies.yaml
  domains:
    - domain: inference.selva.town
      tls: true
      tlsIssuer: cloudflare
      primary: true
  slo:
    availability: 99.95
    latencyP99Ms: 800
  network:
    services:
      - name: inference-gateway
        port: 4306
        ingress: [cloudflare-tunnel]
        # No redis: the gateway deliberately does not depend on real-time
        # state — a Redis outage must never take the inference chokepoint down.
        # `ollama` is the in-cluster local model backend (ClusterIP :11434)
        # that serves restricted/confidential traffic. It is deliberately
        # NOT reachable over `https` egress: the point is that regulated
        # data never leaves the cluster perimeter.
        egress: [dns, https, postgres, ollama]
