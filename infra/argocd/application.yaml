apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: selva-services
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: selva-office
    selva.town/project: selva
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/madfam-org/selva-office.git
    targetRevision: main
    path: infra/k8s/production
  destination:
    server: https://kubernetes.default.svc
    namespace: selva
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
