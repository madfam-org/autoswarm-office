# Canonical Cloudflare DNS records for selva.town (prod + staging).
# Applied via: scripts/apply-cloudflare-infra.py --dns
#
# All hostnames CNAME to the shared MADFAM `enclii-prod` tunnel
# (${tunnel_id}.cfargotunnel.com — resolved at apply time).
# Tunnel ingress routing lives in tunnel-routes.yaml (same tunnel name).

zone: selva.town
tunnel: enclii-prod

records:
  # --- Production ---
  - type: CNAME
    name: api.selva.town
    proxied: true
  - type: CNAME
    name: app.selva.town
    proxied: true
  - type: CNAME
    name: selva.town
    proxied: true
  - type: CNAME
    name: www.selva.town
    proxied: true
  - type: CNAME
    name: ws.selva.town
    proxied: true
  - type: CNAME
    name: admin.selva.town
    proxied: true
  - type: CNAME
    name: inference.selva.town
    proxied: true
  - type: CNAME
    name: gw.selva.town
    proxied: true

  # --- Staging (PP.4) ---
  - type: CNAME
    name: staging-api.selva.town
    proxied: true
  - type: CNAME
    name: staging.selva.town
    proxied: true
  - type: CNAME
    name: staging-admin.selva.town
    proxied: true
  - type: CNAME
    name: staging-ws.selva.town
    proxied: true
  - type: CNAME
    name: staging-gw.selva.town
    proxied: true
