# Selva ingress rules for the shared MADFAM `enclii-prod` Cloudflare tunnel.
# The live tunnel carries ~140 ecosystem hostnames — never PUT the full
# list from this file. Apply with merge mode:
#   python3 scripts/apply-cloudflare-infra.py --tunnel --merge
#
# Prod routes target `selva`; staging routes target `selva-staging`.
# ClusterIP services expose port 80 → containerPort.

tunnel: enclii-prod
# tunnel_id: c9fac286-497b-4aac-9288-f784a1ea561c  # optional override via CLOUDFLARE_TUNNEL_ID
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # --- Production (selva namespace) ---
  - hostname: api.selva.town
    service: http://nexus-api.selva.svc.cluster.local:80
  - hostname: app.selva.town
    service: http://office-ui.selva.svc.cluster.local:80
  - hostname: selva.town
    service: http://office-ui.selva.svc.cluster.local:80
  - hostname: www.selva.town
    service: http://office-ui.selva.svc.cluster.local:80
  - hostname: ws.selva.town
    service: http://colyseus.selva.svc.cluster.local:80
  - hostname: admin.selva.town
    service: http://admin.selva.svc.cluster.local:80
  - hostname: gw.selva.town
    service: http://gateway.selva.svc.cluster.local:80

  # --- Staging (selva-staging namespace) ---
  - hostname: staging-api.selva.town
    service: http://nexus-api.selva-staging.svc.cluster.local:80
  - hostname: staging.selva.town
    service: http://office-ui.selva-staging.svc.cluster.local:80
  - hostname: staging-admin.selva.town
    service: http://admin.selva-staging.svc.cluster.local:80
  - hostname: staging-ws.selva.town
    service: http://colyseus.selva-staging.svc.cluster.local:80
  - hostname: staging-gw.selva.town
    service: http://gateway.selva-staging.svc.cluster.local:80

  - service: http_status:404
