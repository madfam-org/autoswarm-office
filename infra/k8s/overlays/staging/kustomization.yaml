# PP.4 (RFC 0001 Phase 2) — autoswarm-office staging overlay.
#
# Imports the production canonical base and applies staging-specific
# patches. Mirrors Karafiel's PP.1 pilot + Dhanam's PP.2b pattern,
# scaled to 6 Deployments (nexus-api, office-ui, colyseus, admin,
# gateway, workers) + 3 HPAs.
#
# Namespace choice: `autoswarm-staging` matches the ecosystem
# convention (karafiel-staging, dhanam-staging) and the K8s namespace
# tracks the **repo name** even though the product is now branded
# Selva. This is deliberate — the RFC 0005 secret-writer RBAC in the
# prod base is hardcoded to the `autoswarm` namespace, and renaming
# the staging namespace to `selva-staging` would force a parallel
# rename in 3 RBAC files. That rename is tracked as a follow-up; for
# PP.4 we take the smaller diff.
#
# What staging differs from prod on:
#   - namespace: autoswarm-staging
#   - replicas: 1 per deploy (HPAs pinned to maxReplicas=1 via patch)
#   - image digests: updated by staging-deploy.yml on every main merge
#   - env: ENVIRONMENT=staging, SENTRY_ENVIRONMENT=staging, AUTO_DISPATCH_ENABLED=false
#   - secrets: autoswarm-staging-{secrets,llm-secrets,admin-auth}
#   - feature flags: voice-mode live sends off, Stripe live off,
#     Reddit bot off, autonomous dispatch off
#   - Cloudflare DNS + tunnel routes for staging-*.selva.town are
#     ops-managed (see docs/PP_4_STAGING_AUDIT.md § recommended ordering).

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: autoswarm-staging

resources:
  - namespace.yaml
  - ../../production

# Staging replicas: 1 everywhere. HPAs are pinned min=max=1 via
# hpa-disable-patch.yaml — the deployments ignore HPA when at max.
replicas:
  - name: nexus-api
    count: 2
  - name: office-ui
    count: 1
  - name: colyseus
    count: 1
  - name: admin
    count: 1
  - name: gateway
    count: 1
  - name: workers
    count: 1

# Image digests for staging. CI (staging-deploy.yml) updates these on
# every main-branch push via a Python regex patch. The placeholder
# digest below will be overwritten by the first staging deploy.
images:
  - name: ghcr.io/madfam-org/autoswarm-nexus-api
    digest: sha256:c7b37cb9c9e7960915c62b975a481632068288efcbf037bc11de6fa4cd0d0664
  - name: ghcr.io/madfam-org/autoswarm-office-ui
    digest: sha256:086e3b56d2feb74a1e7a94fd400e486bd08ca526f11d8b66f25c2441980b25a1
  - name: ghcr.io/madfam-org/autoswarm-colyseus
    digest: sha256:f030c9719e91f884e8b14e99783f2bb9ca5703eb1b569cbac7b1e2ed112c014c
  - name: ghcr.io/madfam-org/autoswarm-admin
    digest: sha256:9700887fd7bb2000f9d2b29e0b50822544c196b3eaeb005b0b0509b0b8fcfb6d
  - name: ghcr.io/madfam-org/autoswarm-gateway
    digest: sha256:9b7b8c580468ca1531133df3cc8abdeefd60f5ca842368f86872ec4a9a8fc4db
  - name: ghcr.io/madfam-org/selva-workers
    digest: sha256:3ccbaf1906bb378b283bf865f46f90e46ea3dab900a90740f92f2478c8cee297

# Per-deployment strategic-merge-patches. Each file is a single-doc
# patch with explicit `metadata.name` so kustomize's patch matcher
# resolves cleanly (vs multi-doc files which trip up the name lookup
# when namespace is rewritten by the overlay).
patches:
  - path: patch-delete-storageclass.yaml
    target:
      kind: StorageClass
      name: longhorn-autoswarm-backup
  - path: patch-delete-backup-pvc.yaml
    target:
      kind: PersistentVolumeClaim
      name: postgres-backup-pvc
  - path: patch-delete-backup-cronjob.yaml
    target:
      kind: CronJob
      name: postgres-backup
  - path: patch-delete-backup-externalsecret.yaml
    target:
      kind: ExternalSecret
      name: postgres-backup-credentials
  - path: patch-nexus-api.yaml
    target:
      kind: Deployment
      name: nexus-api
  - path: patch-office-ui.yaml
    target:
      kind: Deployment
      name: office-ui
  - path: patch-colyseus.yaml
    target:
      kind: Deployment
      name: colyseus
  - path: patch-admin.yaml
    target:
      kind: Deployment
      name: admin
  - path: patch-gateway.yaml
    target:
      kind: Deployment
      name: gateway
  - path: patch-workers.yaml
    target:
      kind: Deployment
      name: workers

  # HPAs pinned to maxReplicas=1 in staging — single replica is fine
  # and autoscaling would just mask deploy issues.
  - path: hpa-disable-patch.yaml
    target:
      kind: HorizontalPodAutoscaler

  # KEDA workers scaler pinned to 1 — RWO memory PVC cannot multi-attach.
  - path: patch-keda-staging.yaml
    target:
      kind: ScaledObject
      name: workers-keda

# `labels:` replaces the deprecated `commonLabels:`. Adds an
# environment tag so Grafana/Prometheus can slice dashboards by tier.
labels:
  - pairs:
      autoswarm.dev/environment: staging
    includeSelectors: false
