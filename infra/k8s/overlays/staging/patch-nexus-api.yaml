# PP.4 — staging patch for nexus-api (secretRefs + env overrides).
#
# Single-doc strategic-merge-patch: kustomize merges `env` by name,
# so setting ENVIRONMENT here replaces the base's
# `ENVIRONMENT=production`. Secret refs are rewritten to
# selva-staging-secrets / selva-staging-llm-secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-api
spec:
  template:
    spec:
      containers:
        - name: nexus-api
          env:
            - name: ENVIRONMENT
              value: staging
            - name: SENTRY_ENVIRONMENT
              value: staging
            - name: SENTRY_RELEASE
              value: selva-nexus-api@staging
            - name: CORS_ORIGINS
              value: "https://staging.selva.town,https://staging-admin.selva.town,https://staging-api.selva.town"
            - name: PUBLIC_APP_URL
              value: "https://staging.selva.town"
            - name: NEXT_PUBLIC_APP_URL
              value: "https://staging.selva.town"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: selva-staging-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: selva-staging-secrets
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-staging-secrets
                  key: secret-key
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-staging-secrets
                  key: RESEND_API_KEY
            - name: WORKER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: selva-staging-secrets
                  key: WORKER_API_TOKEN
            - name: COLYSEUS_SECRET
              valueFrom:
                secretKeyRef:
                  name: selva-staging-secrets
                  key: colyseus-secret
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-staging-llm-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: DEEPINFRA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-staging-llm-secrets
                  key: DEEPINFRA_API_KEY
                  optional: true
            - name: CONSENT_LEDGER_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: selva-staging-secrets
                  key: CONSENT_LEDGER_SIGNING_SECRET
            - name: DHANAM_API_URL
              value: "https://staging-api.dhan.am"
            - name: DHANAM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: selva-staging-secrets
                  key: DHANAM_WEBHOOK_SECRET
                  optional: true
            - name: BILLING_VIA_DHANAM
              value: "true"
            # Load-test calibration: worker JWT sub is shared (service:worker); default 10/min blocks 100-VU k6.
            - name: DISPATCH_RATE_LIMIT
              value: "500"
            - name: DISPATCH_RATE_WINDOW
              value: "60"
            # Global IP bucket (RateLimitMiddleware); k6 runs from one egress IP.
            - name: RATE_LIMIT_PER_MINUTE
              value: "10000"
            - name: TULANA_API_URL
              value: "https://tulana-api.madfam.io"
            - name: TULANA_SELVA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: selva-staging-secrets
                  key: TULANA_SELVA_WEBHOOK_SECRET
                  optional: true
