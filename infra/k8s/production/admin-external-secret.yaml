# ExternalSecret template for Selva Admin SSO session signing.
# Not included in the active kustomization until Vault KV `secret/selva`
# exists with property `janua_secret_key`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: selva-admin-auth
  namespace: selva
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: selva-office
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: selva-admin-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: JANUA_SECRET_KEY
      remoteRef:
        key: secret/selva
        property: janua_secret_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
