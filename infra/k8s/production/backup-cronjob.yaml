apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-autoswarm-backup
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: disabled
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: autoswarm
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: autoswarm-office
    app.kubernetes.io/component: backup
spec:
  storageClassName: longhorn-autoswarm-backup
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: autoswarm
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: autoswarm-office
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *"  # Daily at 02:00 UTC
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800  # 30 minute timeout
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/part-of: autoswarm-office
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          serviceAccountName: autoswarm-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: docker.io/library/postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  FILENAME="autoswarm_${TIMESTAMP}.dump"
                  FILEPATH="/backups/${FILENAME}"

                  echo "[backup] Starting PostgreSQL backup at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

                  PG_DUMP_DB=$(printf '%s' "${DATABASE_URL}" | sed -E 's|^[^/]*//[^/]*/([^?]*).*|\1|')
                  if [ -z "${PG_DUMP_DB}" ] || [ "${PG_DUMP_DB}" = "${DATABASE_URL}" ]; then
                    echo "[backup] ERROR: Could not derive database name from DATABASE_URL"
                    exit 1
                  fi

                  PG_READY_ATTEMPT=1
                  until pg_isready \
                    --host=postgres.data.svc.cluster.local \
                    --port=5432 \
                    --username="${POSTGRES_USER}" \
                    --dbname="${PG_DUMP_DB}" >/dev/null 2>&1; do
                    if [ "${PG_READY_ATTEMPT}" -ge 12 ]; then
                      echo "[backup] ERROR: PostgreSQL was not ready after ${PG_READY_ATTEMPT} attempts"
                      exit 1
                    fi
                    echo "[backup] Waiting for PostgreSQL readiness (${PG_READY_ATTEMPT}/12)"
                    PG_READY_ATTEMPT=$((PG_READY_ATTEMPT + 1))
                    sleep 5
                  done

                  PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump \
                    --host=postgres.data.svc.cluster.local \
                    --port=5432 \
                    --username="${POSTGRES_USER}" \
                    --dbname="${PG_DUMP_DB}" \
                    --format=custom \
                    --compress=9 \
                    --no-owner \
                    --no-privileges \
                    --file="${FILEPATH}"

                  FILESIZE=$(stat -c%s "${FILEPATH}" 2>/dev/null || echo "unknown")
                  echo "[backup] Backup created: ${FILEPATH} (${FILESIZE} bytes)"

                  if [ "${FILESIZE}" = "0" ]; then
                    echo "[backup] ERROR: Backup file is empty"
                    exit 1
                  fi

                  # Upload to S3 if bucket is configured
                  if [ -n "${S3_BUCKET:-}" ]; then
                    DAY_OF_WEEK=$(date +%u)
                    if [ "${DAY_OF_WEEK}" = "7" ]; then
                      S3_PREFIX="weekly"
                    else
                      S3_PREFIX="daily"
                    fi
                    # Use pre-installed aws CLI from init container or base image
                    if command -v aws >/dev/null 2>&1; then
                      aws s3 cp "${FILEPATH}" "s3://${S3_BUCKET}/autoswarm/${S3_PREFIX}/${FILENAME}"
                      echo "[backup] Uploaded to s3://${S3_BUCKET}/autoswarm/${S3_PREFIX}/${FILENAME}"
                    else
                      echo "[backup] WARNING: aws CLI not available, skipping S3 upload"
                    fi
                  fi

                  # Rotate: keep last 30 daily backups on local PVC
                  ls -t /backups/autoswarm_*.dump 2>/dev/null | tail -n +31 | xargs -r rm -f

                  echo "[backup] Backup complete at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: autoswarm-secrets
                      key: database-url
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-credentials
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-credentials
                      key: password
                - name: S3_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: autoswarm-config
                      key: backup-s3-bucket
                      optional: true
              volumeMounts:
                - name: backup-volume
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup-volume
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
            - name: tmp
              emptyDir:
                sizeLimit: 100Mi
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-backup-credentials
  namespace: autoswarm
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: data-kubernetes-store
    kind: ClusterSecretStore
  target:
    name: postgres-backup-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: postgres-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: postgres-credentials
        property: password
