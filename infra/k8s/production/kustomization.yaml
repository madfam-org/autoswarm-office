apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: autoswarm

  # RFC 0005 Sprint 1a — dedicated SA in the `autoswarm` namespace.
  # The per-target-namespace Roles + RoleBindings live in
  # selva-secret-writer-rolebinding.yaml and are applied OUTSIDE this
  # kustomize bundle (kustomize's namespace: autoswarm would rewrite
  # them incorrectly). See that file's header for the ops procedure.
resources:
- configmap.yaml
- org-config.yaml
- service-account.yaml
- nexus-api.yaml
- office-ui.yaml
- colyseus.yaml
- admin.yaml
- admin-external-secret.yaml
- gateway.yaml
- workers.yaml
- service-monitors.yaml
- pdb.yaml
- hpa.yaml
- backup-cronjob.yaml
- keda-scaledobject.yaml
- keda-trigger-auth.yaml
- selva-secret-writer-sa.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: autoswarm-office

# Image digest pins per RFC 0017 + 2026-05-03 ecosystem-health audit
# (Kyverno fail-closed mutable-tag policy). Each deployment manifest
# (admin.yaml, colyseus.yaml, gateway.yaml, nexus-api.yaml, office-ui.yaml)
# still references `:latest` inline; kustomize rewrites these to
# digest-pinned references at build time. Workers is pinned inline in
# workers.yaml and is also listed here so digest automation can update
# the rebranded `selva-workers` image.
#
# Digests sourced from the most recent successful Build job logs in
# `.github/workflows/deploy.yml` runs (the `pushing manifest for
# <image>:latest@sha256:…` line). One per image:
#
#   nexus-api : run 24940442724 / 2026-04-25T20:54Z (commit fdd5a85)
#   office-ui : run 24480880306 / 2026-04-15T22:09Z
#   colyseus  : run 24879593455 / 2026-04-24T08:18Z
#   admin     : run 24616588100 / 2026-04-18T23:48Z
#   gateway   : live ready ReplicaSet gateway-85fc69c6b6 / 2026-05-04
#
# Older office-ui digests reflect change-detection skipping its builds
# for unrelated commits. Gateway is pinned to the most recent digest
# observed in a ready production ReplicaSet after the newer audit-derived
# digest failed to pull.
images:
- digest: sha256:41651850ac38cffce4da53d7685a219e9900f50a321fe86e96524fbfd968f792
  name: ghcr.io/madfam-org/autoswarm-admin
  newName: ghcr.io/madfam-org/autoswarm-admin
- digest: sha256:8b912e0fb63ab16ec3fb856723c0389e40a295d32b31d70cd458a881b7a92c68
  name: ghcr.io/madfam-org/autoswarm-colyseus
  newName: ghcr.io/madfam-org/autoswarm-colyseus
- digest: sha256:71a0de873371ef897b62d95167c21fec3f466e331fedd6633b2ce2e05d6b686c
  name: ghcr.io/madfam-org/autoswarm-gateway
  newName: ghcr.io/madfam-org/autoswarm-gateway
- digest: sha256:b93b4f78c49a40a98a21e6eb2dadcf13d656edb494738482250fd9855e9e07d4
  name: ghcr.io/madfam-org/autoswarm-nexus-api
  newName: ghcr.io/madfam-org/autoswarm-nexus-api
- digest: sha256:83e621d162c582b1a61b709416567edfcf3441d6e88693f7c66c1a3049ffb0aa
  name: ghcr.io/madfam-org/autoswarm-office-ui
  newName: ghcr.io/madfam-org/autoswarm-office-ui
- digest: sha256:6b9951de32d057219616fea68c68abb6e14f4013b30226a8072a8b2e20abb750
  name: ghcr.io/madfam-org/selva-workers
  newName: ghcr.io/madfam-org/selva-workers

# Phase 0 — optional OTel + Sentry env (no-op until observability secret exists).
patches:
- path: patches/observability-nexus-api.yaml
  target:
    kind: Deployment
    name: nexus-api
- path: patches/observability-workers.yaml
  target:
    kind: Deployment
    name: workers
- path: patches/observability-gateway.yaml
  target:
    kind: Deployment
    name: gateway
- path: patches/observability-colyseus.yaml
  target:
    kind: Deployment
    name: colyseus
- path: patches/observability-office-ui.yaml
  target:
    kind: Deployment
    name: office-ui
- path: patches/observability-admin.yaml
  target:
    kind: Deployment
    name: admin
