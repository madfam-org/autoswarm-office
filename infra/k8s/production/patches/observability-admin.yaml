apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  template:
    spec:
      containers:
        - name: admin
          env:
            - name: NEXT_PUBLIC_SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: selva-observability-secrets
                  key: SENTRY_DSN_ADMIN
                  optional: true
            - name: SENTRY_ENVIRONMENT
              value: production
