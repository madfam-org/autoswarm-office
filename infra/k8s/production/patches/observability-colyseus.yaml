apiVersion: apps/v1
kind: Deployment
metadata:
  name: colyseus
spec:
  template:
    spec:
      containers:
        - name: colyseus
          env:
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: selva-observability-secrets
                  key: SENTRY_DSN_COLYSEUS
                  optional: true
            - name: SENTRY_ENVIRONMENT
              value: production
