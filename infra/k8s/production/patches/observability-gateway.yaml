apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  template:
    spec:
      containers:
        - name: gateway
          env:
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: autoswarm-observability-secrets
                  key: SENTRY_DSN_GATEWAY
                  optional: true
            - name: SENTRY_ENVIRONMENT
              value: production
