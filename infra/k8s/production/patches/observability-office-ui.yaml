apiVersion: apps/v1
kind: Deployment
metadata:
  name: office-ui
spec:
  template:
    spec:
      containers:
        - name: office-ui
          env:
            - name: NEXT_PUBLIC_SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: selva-observability-secrets
                  key: SENTRY_DSN_OFFICE_UI
                  optional: true
            - name: SENTRY_ENVIRONMENT
              value: production
