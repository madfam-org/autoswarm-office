# Cross-path ExternalSecret: selva reads phynd's canonical HMAC/bearer values
# so selva can SIGN/PRESENT the exact values phynd VERIFIES — no manual mirror.
#
# "verifier-owns" convention: phynd is the verifier of these secrets, so the
# canonical property lives in phynd's own Vault path (secret/phynd-crm) and
# phynd's own ExternalSecret owns it. selva is a READER of that same property.
# One operator seed into secret/phynd-crm fans out to both namespaces via the
# shared vault-store ClusterSecretStore — Vault's eso-reader policy is
# `secret/data/*` bound to one controller identity, so the ES namespace is
# irrelevant to Vault access control (same mechanism already used by the
# secret/comms Resend fan-out that phynd-crm and dhanam both read cross-path).
#
# secret/phynd-crm already EXISTS and syncs today (phynd-crm-secrets is Ready),
# so this ES is safe to activate now — unlike admin-external-secret.yaml which
# waits on secret/selva. If a mapped property is not yet seeded, ONLY this
# isolated Secret parks in SecretSyncError; nexus-api mounts it optional:true
# (see nexus-api env wiring in the autoprovision runbook) so config.py's
# empty-string default keeps the signer skipped / auth proxy honest-503 until
# the first sync. No consumer boot dependency; no secret value in git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: selva-phynd-secrets
  namespace: selva
  labels:
    app.kubernetes.io/name: nexus-api
    app.kubernetes.io/part-of: selva-office
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: selva-phynd-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # nexus-api signs campaign-import HMAC with the value phynd verifies (RFC 0031).
    - secretKey: PHYND_CAMPAIGN_IMPORT_SECRET
      remoteRef:
        key: secret/phynd-crm
        property: phynd_campaign_import_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # selva/office presents this bearer on phynd federation reads (service:selva).
    - secretKey: PHYND_CRM_FEDERATION_TOKEN
      remoteRef:
        key: secret/phynd-crm
        property: federation_api_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
