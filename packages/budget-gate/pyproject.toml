[project]
name = "madfam-budget-gate"
version = "0.1.0"
description = "Redis-backed token + USD spend gate for autonomous LLM campaigns. Enforces daily/monthly caps per scope (org / agent / global) before each inference call."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Innovaciones MADFAM" }]
keywords = ["budget", "gate", "llm", "redis", "rate-limiting", "cost-control"]

dependencies = [
    "redis>=5.2.1",
    "httpx>=0.28.1",
    "pydantic>=2.10.5",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "fakeredis[lua]>=2.26.0",
    "fastapi>=0.115",
    "ruff>=0.8.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/madfam_budget_gate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
