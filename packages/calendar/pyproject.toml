[project]
name = "selva-calendar"
version = "0.1.0"
description = "Calendar integration adapters for Selva Office"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selva_calendar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
