[project]
name = "selva-tools"
version = "0.1.0"
description = "Tool registry and built-in tools for AutoSwarm agent workflows"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.5",
  "httpx>=0.28.1",
  # RFC 0005: k8s_secret tool uses the official SDK for in-cluster
  # SA token discovery, object models, and kubeconfig loading. A bare
  # httpx-against-the-API implementation was considered (it would drop
  # a large transitive footprint) but the SDK's built-in SA-token
  # mounting behaviour is exactly the feature we want to lean on, and
  # the risk of rolling our own auth + TLS cert handling outweighs the
  # weight savings. Revisit in Sprint 3 when Vault lands.
  "kubernetes>=31.0.0",
  # HTML sanitiser for outbound marketing email bodies. Replaces the
  # regex-based stripper which is bypassable via nested tags
  # (``<scr<script>ipt>``), single-quoted attributes, SVG-embedded
  # ``href="javascript:..."``, and entity encoding. ``bleach`` uses an
  # allow-list parser (html5lib under the hood) so unknown tags and
  # attributes are dropped wholesale, not pattern-matched.
  "bleach[css]>=6.0",
]

[project.optional-dependencies]
mcp = ["jsonrpc-base>=2.0"]
# Reddit posting capability lives in builtins/reddit_tools.py. Optional
# because (a) most workers do not need it, (b) PRAW pulls in
# ``prawcore`` and ``websocket-client`` which add ~300KB to the image,
# and (c) the tool degrades gracefully — when ``praw`` is missing it
# raises ``ToolNotConfiguredError`` so the operator gets a clear signal.
# Install via ``pip install selva-tools[reddit]`` in worker images that
# need outbound social.
reddit = ["praw>=7.7,<8"]
# Mastodon posting capability lives in builtins/mastodon_tools.py.
# Optional for the same reasons as Reddit — Mastodon.py pulls in
# ``requests`` (already a transitive dep elsewhere) and
# ``python-magic`` for media MIME-sniffing, which we don't strictly
# need for text-only toots but ship anyway. Tool degrades gracefully
# when the lib is missing (raises ``ToolNotConfiguredError``). Install
# via ``pip install selva-tools[mastodon]`` in worker images that need
# fediverse outbound.
mastodon = ["Mastodon.py>=1.8,<3"]
# Bluesky / AT Protocol posting capability lives in
# builtins/bluesky_tools.py. Optional for the same reasons as ``reddit``
# (most workers don't need it; ``atproto`` pulls in ``websockets`` and
# ``libipld`` adding ~500KB to the image; tool degrades gracefully —
# raises ``ToolNotConfiguredError`` when the package is missing).
# Install via ``pip install selva-tools[bluesky]`` in worker images
# that need outbound public-social via Bluesky.
bluesky = ["atproto>=0.0.46"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selva_tools"]
